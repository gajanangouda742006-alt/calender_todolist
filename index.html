<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DaySync</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('themePreference') || 'system';
          const theme = preference === 'light' || preference === 'dark'
            ? preference
            : (window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta
      name="description"
      content="DaySync — your personal planner for tasks, calendar, expenses, goals, and focus."
    />
    <link rel="stylesheet" href="./style.css?v=daysync-mobile-polish-20261103-v1" />
    <link rel="stylesheet" href="./goal-achievements-3d.css?v=daysync-mobile-polish-20261103-v1" />
    <link rel="icon" type="image/png" sizes="192x192" href="./images/DaySync-192.png" />
    <link rel="apple-touch-icon" href="./images/DaySync-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#111a35" />
<meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app-startup-intro" class="startup-intro" aria-hidden="true" hidden>
      <video muted playsinline preload="none" poster="./assets/intro-poster.jpeg">
        <source src="./assets/app-intro.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="mobile-frame">
      <main id="app" aria-live="polite">
        <div class="daysync-boot-shell" role="status" aria-live="polite">
          <img src="./images/DaySync-192.png" width="48" height="48" alt="" />
          <strong>DaySync</strong>
          <span>Opening your planner…</span>
          <span class="daysync-boot-spinner" aria-hidden="true"></span>
        </div>
      </main>

      <nav class="bottom-nav" aria-label="Main navigation">
  <div class="nav-indicator"></div>
  <button class="nav-item active" type="button" data-view="home">
    <span>🏠</span>
    <span>Home</span>
  </button>

  <button class="nav-item" type="button" data-view="assistant">
    <span>🤖</span>
    <span>Assistant</span>
  </button>

  <!-- The Menu button is now the final item on the right -->
<button class="nav-item" type="button" data-action="toggle-more-menu">
    <img
        src="menubars.png"
        alt="Menu"
        style="width: 33px; height: 33px; object-fit: contain; margin-bottom: 3px; border-radius: 4px;"
    >
    <span>Menu</span>
</button>
</nav>
    </div>

    <script src="./app-config.js"></script>
<script type="module" src="./web-app.js?v=daysync-mobile-polish-20261103-v1"></script>

<script>
(() => {
  const INTRO_FLAG = 'sahra:play-intro-after-auth';
  const intro = document.getElementById('app-startup-intro');
  const video = intro?.querySelector('video');
  // Show the short branded opening animation on every fresh app load. App
  // initialization continues underneath it, so this never delays data startup.
  // Remove the older auth flag so an upgrade cannot replay the intro twice.
  let shouldPlay = true;
  try { window.sessionStorage.removeItem(INTRO_FLAG); } catch (_error) { /* optional storage */ }

  if (!intro || !video || !shouldPlay) {
    if (video) {
      video.pause();
      video.removeAttribute('autoplay');
    }
    if (intro) {
      intro.hidden = true;
      intro.setAttribute('aria-hidden', 'true');
    }
    return;
  }

  intro.hidden = false;
  intro.setAttribute('aria-hidden', 'false');
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  video.removeAttribute('autoplay');
  try { video.currentTime = 0; } catch (_error) {}

  let finished = false;
  let fallbackTimer;
  const finish = () => {
    if (finished) return;
    finished = true;
    window.clearTimeout(fallbackTimer);
    video.removeEventListener('ended', finish);
    video.removeEventListener('error', finish);
    intro.classList.add('is-exiting');
    window.setTimeout(() => {
      video.pause();
      intro.hidden = true;
      intro.setAttribute('aria-hidden', 'true');
      intro.classList.remove('is-playing', 'is-exiting');
      try { video.currentTime = 0; } catch (_error) {}
    }, 650);
  };

  fallbackTimer = window.setTimeout(finish, 6000);
  video.addEventListener('playing', () => intro.classList.add('is-playing'), { once: true });
  video.addEventListener('ended', finish, { once: true });
  video.addEventListener('error', finish, { once: true });

  try {
    video.load();
    const playback = video.play();
    if (playback && typeof playback.catch === 'function') {
      playback.catch((error) => {
        console.warn('Sahra intro playback failed; continuing into the app.', error);
        finish();
      });
    }
  } catch (error) {
    console.warn('Sahra intro playback failed; continuing into the app.', error);
    finish();
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch((error) => {
          console.error('DaySync service worker registration failed:', error);
        });
    });
  }
</script>
  </body>
</html>
