<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sahra Life Calendar</title>
    <meta
      name="description"
      content="Sahra Life Calendar — a futuristic personal life management dashboard."
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#111a35" />
<meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app-startup-intro" class="startup-intro" aria-hidden="true" hidden>
      <img
        class="startup-intro-poster"
        src="./assets/intro-poster.jpeg"
        alt=""
        aria-hidden="true"
      />
      <video muted playsinline autoplay preload="auto" poster="./assets/intro-poster.jpeg">
        <source src="./assets/app-intro.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="mobile-frame">
      <main id="app" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
  <div class="nav-indicator"></div>
  <button class="nav-item active" type="button" data-view="home">
    <span>🏠</span>
    <span>Home</span>
  </button>

  <button class="nav-item" type="button" data-view="assistant">
    <span>🤖</span>
    <span>Assistant</span>
  </button>

  <!-- The Menu button is now the final item on the right -->
<button class="nav-item" type="button" data-action="toggle-more-menu">
    <img
        src="menubars.png"
        alt="Menu"
        style="width: 33px; height: 33px; object-fit: contain; margin-bottom: 3px; border-radius: 4px;"
    >
    <span>Menu</span>
</button>
</nav>
    </div>

    <script src="./app-config.js"></script>
<script type="module" src="./web-app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch((error) => {
          console.error('Sahra service worker registration failed:', error);
        });
    });
  }
</script>
  </body>
</html>
