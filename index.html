<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sahra Life Calendar</title>
    <meta
      name="description"
      content="Sahra Life Calendar — a futuristic personal life management dashboard."
    />
    <link rel="stylesheet" href="./style.css?v=sahra-settings-navigation-20261028-1850" />
    <link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#111a35" />
<meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app-startup-intro" class="startup-intro" aria-hidden="true" hidden>
      <img
        class="startup-intro-poster"
        src="./assets/intro-poster.jpeg"
        alt=""
        aria-hidden="true"
      />
      <video muted playsinline preload="auto" poster="./assets/intro-poster.jpeg">
        <source src="./assets/app-intro.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="mobile-frame">
      <main id="app" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
  <div class="nav-indicator"></div>
  <button class="nav-item active" type="button" data-view="home">
    <span>🏠</span>
    <span>Home</span>
  </button>

  <button class="nav-item" type="button" data-view="assistant">
    <span>🤖</span>
    <span>Assistant</span>
  </button>

  <!-- The Menu button is now the final item on the right -->
<button class="nav-item" type="button" data-action="toggle-more-menu">
    <img
        src="menubars.png"
        alt="Menu"
        style="width: 33px; height: 33px; object-fit: contain; margin-bottom: 3px; border-radius: 4px;"
    >
    <span>Menu</span>
</button>
</nav>
    </div>

    <script src="./app-config.js"></script>
<script type="module" src="./web-app.js?v=sahra-settings-navigation-20261028-1850"></script>

<script>
(() => {
  const INTRO_FLAG = 'sahra:play-intro-after-auth';
  const intro = document.getElementById('app-startup-intro');
  const video = intro?.querySelector('video');
  let shouldPlay = false;

  // The animation is opt-in: only a successful login/signup sets this flag.
  // Consume it immediately so refreshes and normal navigation do not replay it.
  try {
    shouldPlay = window.sessionStorage.getItem(INTRO_FLAG) === '1';
    window.sessionStorage.removeItem(INTRO_FLAG);
  } catch (_error) {
    // Storage can be unavailable in restricted browsing modes; the app still works.
  }

  if (!intro || !video || !shouldPlay) {
    if (video) {
      video.pause();
      video.removeAttribute('autoplay');
    }
    if (intro) {
      intro.hidden = true;
      intro.setAttribute('aria-hidden', 'true');
    }
    return;
  }

  intro.hidden = false;
  intro.setAttribute('aria-hidden', 'false');
  video.muted = true;
  video.playsInline = true;
  video.removeAttribute('autoplay');
  try { video.currentTime = 0; } catch (_error) {}

  let finished = false;
  let fallbackTimer;
  const finish = () => {
    if (finished) return;
    finished = true;
    window.clearTimeout(fallbackTimer);
    video.removeEventListener('ended', finish);
    video.removeEventListener('error', finish);
    intro.classList.add('is-exiting');
    window.setTimeout(() => {
      video.pause();
      intro.hidden = true;
      intro.setAttribute('aria-hidden', 'true');
      intro.classList.remove('is-playing', 'is-exiting');
      try { video.currentTime = 0; } catch (_error) {}
    }, 650);
  };

  fallbackTimer = window.setTimeout(finish, 90000);
  video.addEventListener('playing', () => intro.classList.add('is-playing'), { once: true });
  video.addEventListener('ended', finish, { once: true });
  video.addEventListener('error', finish, { once: true });

  try {
    const playback = video.play();
    if (playback && typeof playback.catch === 'function') {
      playback.catch((error) => {
        console.warn('Sahra intro playback failed; continuing into the app.', error);
        finish();
      });
    }
  } catch (error) {
    console.warn('Sahra intro playback failed; continuing into the app.', error);
    finish();
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch((error) => {
          console.error('Sahra service worker registration failed:', error);
        });
    });
  }
</script>
  </body>
</html>
